name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila l'APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ArmadioAI.apk

      - name: Allega l'APK alla build
        uses: actions/upload-artifact@v4
        with:
          name: ArmadioAI-apk
          path: ArmadioAI.apk

      - name: Pubblica una release scaricabile dal telefono
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Armadio AI – build ${{ github.run_number }}
          body: Scarica ArmadioAI.apk dal telefono e aprilo per installarlo.
          files: ArmadioAI.apk
